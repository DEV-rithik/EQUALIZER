<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .eq-bar {
            transition: height 0.3s ease;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Profile" data-alt="User profile circular avatar portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAARrFyPP4yWXAdlnoWhWoEG_X38FUK2a9ewWK-ey63fwiYmHZCtv1YGSiuDVO9D03lIk8lOwp-MqkvvTX18XwDY8NstCICmgfm4TTJcROvkel3eXo9U8iUO_QtXcCaYqn9eq2eaLBDOOEYLcfibrnOqtjobyZoHmJ4Q_4vILB1QkCsAQzR7GJt7EA0O26bNw0r2Fu3Q_BvHFuqcrnCvVOBqZpUiPlBqEfCGj92ZSHfrY3QJuCW5OYBogZ1BWZCwaerMcc0BQHJW2m5"/>
</div>
<h1 class="font-headline font-bold tracking-tight text-zinc-900 dark:text-zinc-100 text-xl">Equalizer</h1>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100">settings</span>
</button>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto space-y-10">
<!-- Hero Section: Album Art & Details -->
<section class="flex flex-col items-center text-center space-y-8">
<div class="relative group">
<div class="absolute -inset-4 bg-primary/10 blur-3xl rounded-full opacity-50 group-hover:opacity-70 transition-opacity"></div>
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-xl overflow-hidden shadow-2xl">
<img alt="Song Artwork" class="w-full h-full object-cover" data-alt="Abstract vibrant album cover art with neon lights" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBV2m5LOAiEm05DzyugbCcXgy5P4eaRHnZEdC-y8uz9ls479XHRzco0W3c84zpikfMyPVv5xCgQSox53WXqzXkU_-y-sBPpSAS3RxYd0oQdvoLPKjSuHXUr2Ntz8bomUNAM0kPOtqTLicK5yGZOB5BO4qExVWTai_UPRbOHwUbFNHL14mO5GHg8YH0kfdMURx311a8CQMystw7jEk5XyeoJd2MYOyf0sMJlVKAqIO1dpFNhgS7klmS69aaM_z7Bz4X3hhQBAU2BFNz-"/>
</div>
</div>
<div class="space-y-2">
<h2 class="text-3xl md:text-4xl font-bold tracking-tight text-on-surface">Midnight City</h2>
<p class="text-lg md:text-xl text-on-surface-variant font-medium">M83 • Hurry Up, We're Dreaming</p>
<div class="pt-2 flex justify-center gap-2">
<span class="px-3 py-1 bg-surface-container-low rounded-full text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Recommended for: Blessing 3</span>
</div>
</div>
</section>
<!-- EQ Visualization Section -->
<section class="bg-surface-container-low rounded-xl p-8 space-y-8">
<div class="flex justify-between items-end">
<div>
<span class="text-[10px] font-bold tracking-widest uppercase text-primary mb-1 block">Audio Profile</span>
<h3 class="text-2xl font-bold text-on-surface">Precision Tuning</h3>
</div>
<div class="flex gap-2">
<button class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center text-on-surface shadow-sm active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">refresh</span>
</button>
</div>
</div>
<!-- 10-Band EQ Graph -->
<div class="relative h-48 flex items-end justify-between gap-2 md:gap-4 px-2">
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-10">
<div class="border-t border-on-surface"></div>
<div class="border-t border-on-surface border-dashed"></div>
<div class="border-t border-on-surface"></div>
<div class="border-t border-on-surface border-dashed"></div>
<div class="border-t border-on-surface"></div>
</div>
<!-- EQ Bars (Visualizing the 'Curvature') -->
<div class="flex-1 bg-primary/20 rounded-t-full eq-bar" style="height: 65%;"></div>
<div class="flex-1 bg-primary/40 rounded-t-full eq-bar" style="height: 45%;"></div>
<div class="flex-1 bg-primary/60 rounded-t-full eq-bar" style="height: 30%;"></div>
<div class="flex-1 bg-primary/80 rounded-t-full eq-bar" style="height: 25%;"></div>
<div class="flex-1 bg-primary rounded-t-full eq-bar" style="height: 40%;"></div>
<div class="flex-1 bg-primary rounded-t-full eq-bar" style="height: 70%;"></div>
<div class="flex-1 bg-primary/80 rounded-t-full eq-bar" style="height: 85%;"></div>
<div class="flex-1 bg-primary/60 rounded-t-full eq-bar" style="height: 60%;"></div>
<div class="flex-1 bg-primary/40 rounded-t-full eq-bar" style="height: 75%;"></div>
<div class="flex-1 bg-primary/20 rounded-t-full eq-bar" style="height: 90%;"></div>
</div>
<!-- Frequency Labels -->
<div class="flex justify-between px-1">
<span class="text-[10px] font-bold text-on-surface-variant opacity-50">32Hz</span>
<span class="text-[10px] font-bold text-on-surface-variant opacity-50">1kHz</span>
<span class="text-[10px] font-bold text-on-surface-variant opacity-50">16kHz</span>
</div>
</section>
<!-- Action Button -->
<section class="flex flex-col items-center space-y-4">
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-primary-container text-white font-bold text-lg shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
                Apply EQ Settings
            </button>
<p class="text-xs text-on-surface-variant opacity-70">Settings optimized for Moondrop Blessing 3 IEMs</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center pt-3 pb-6 px-4 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-xl border-t border-zinc-100/50 dark:border-zinc-800/50 z-50">
<button class="flex flex-col items-center justify-center text-rose-600 dark:text-rose-500 tap-highlight-transparent active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] font-medium tracking-wide mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 tap-highlight-transparent active:scale-90 transition-transform">
<span class="material-symbols-outlined">search</span>
<span class="text-[10px] font-medium tracking-wide mt-1">Search</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 tap-highlight-transparent active:scale-90 transition-transform">
<span class="material-symbols-outlined">library_music</span>
<span class="text-[10px] font-medium tracking-wide mt-1">Library</span>
</button>
</nav>
</body></html>
